  tmt_gpu_instead_of_tpu: 0.04
  wrong_unit: 0.02
  mapping_not_verified: 0.06     # ไม่ผ่านการยืนยัน (UNMATCHED/SUGGESTED/REJECTED)
price_noise_between_hospitals: 0.08
procurement_variance:            # [สมมติ] ความผิดพลาด/ส่วนลดการจัดซื้อที่ทำให้เกิดยาเกินและใกล้หมดอายุ (ให้ F2 มีเหตุการณ์จริงให้ใช้)
  oversize_prob: 0.015           # สั่งเกินขนาด (x2.5–5) เฉพาะยาที่ใช้สม่ำเสมอ
  oversize_mult: [2.5, 5.0]
  oversize_short_prob: 0.7       # ในกรณีสั่งเกิน มักเป็นล็อตลดราคาที่อายุเหลือสั้นมาก
  oversize_short_range: [0.06, 0.14]
  short_dated_prob: 0.07         # ล็อตที่ส่งมามีอายุเหลือน้อย
  short_dated_range: [0.20, 0.45]

