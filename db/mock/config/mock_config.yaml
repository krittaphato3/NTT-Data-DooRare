borrow:
  stop_ratio: {V: 0.90, E: 1.00}
  timeout_min: {VERY_URGENT: 120, URGENT: 360, NORMAL: 2880}
  score_weights: {time: 0.45, fulfill: 0.28, stock_safety: 0.17, reliability: 0.10}
  max_legs: 4
  request_probability: {V: 0.9, E: 0.55, D: 0.2}
  cooldown_days: 15
  return_days: 30
  waive_probability: 0.03
  lender_safety_days: 14
  lot_min_remaining_days: 90
expiry:
  threshold_days_default: 180
  threshold_days_V: 120          # ผู้เภสัชกรตั้งให้ยา V สั้นกว่า (ตัวอย่างค่าต่อรายการ)
  min_value_thb: 1500
  max_cost_ratio: 0.20
  transport_base_thb: 350
  transport_per_km_thb: 11
  cold_chain_extra_thb: 600
  scan_from: 2016-12-01
