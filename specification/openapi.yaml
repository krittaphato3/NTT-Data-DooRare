components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Resource version; mismatch -> 409 VERSION_CONFLICT
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Ok:
      type: object
      properties:
        ok:
          type: boolean
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Machine code e.g. NO_LENDER, VERSION_CONFLICT, MAPPING_NOT_VERIFIED,
            GUARDRAIL_REJECTED
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - title
      - status
    JobRef:
      type: object
      properties:
        jobId: *id001
        status:
          type: string
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    BorrowRequestCreate:
      type: object
      properties:
        context:
          type: string
          enum:
          - STOCK_ALERT
          - MANUAL
        stockAlertId: *id001
        reason:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              drugMasterId: *id001
              qtyRequested:
                type: number
                exclusiveMinimum: 0
            required:
            - drugMasterId
        urgency:
          type: string
          enum:
          - NORMAL
          - URGENT
          - VERY_URGENT
        preferredLenderIds:
          type: array
          items: *id001
      required:
      - context
    ApproveRequest:
      type: object
      properties:
        version:
          type: integer
        comment:
          type: string
      required:
      - version
    LadderUpdate:
      type: object
      properties:
        version:
          type: integer
        ladder:
          type: array
          items:
            type: object
            properties:
              lenderHospitalId: *id001
              qtyAsk: &id002
                type: number
            required:
            - lenderHospitalId
            - qtyAsk
      required:
      - version
      - ladder
    LegResponse:
      type: object
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - PARTIAL
          - REJECT
        qtyAccepted: *id002
        lots:
          type: array
          items:
            type: object
            properties:
              lotId: *id001
              qty: *id002
            required:
            - lotId
            - qty
        rejectReason:
          type: string
      required:
      - decision
    PlanDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        comment:
          type: string
        version:
          type: integer
      required:
      - decision
      - version
    IncidentCreate:
      type: object
      properties:
        hospitalId: *id001
        locationLat: *id002
        locationLon: *id002
        locationText:
          type: string
        reportedEtaMin:
          type: integer
          minimum: 0
        counts:
          type: object
          properties:
            RED:
              type: integer
              minimum: 0
            YELLOW:
              type: integer
              minimum: 0
            GREEN:
              type: integer
              minimum: 0
            BLACK:
              type: integer
              minimum: 0
      required:
      - counts
    TransportAdvance:
      type: object
      properties:
        toStatus:
          type: string
          enum:
          - LOADED
          - IN_TRANSIT
          - ARRIVED
          - RECEIVED
        photoKeys:
          type: array
          maxItems: 10
          items:
            type: string
        version:
          type: integer
      required:
      - toStatus
      - version
    TransportEventBatch:
      type: object
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              clientEventId: *id001
              seq:
                type: integer
                minimum: 0
              toStatus:
                type: string
                enum:
                - LOADED
                - IN_TRANSIT
                - ARRIVED
                - RECEIVED
              capturedAt: &id003
                type: string
                format: date-time
              photoKeys:
                type: array
                maxItems: 10
                items:
                  type: string
            required:
            - clientEventId
            - seq
            - toStatus
            - capturedAt
      required:
      - events
    TransportSyncResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              clientEventId: *id001
              outcome:
                type: string
                enum:
                - APPLIED
                - DUPLICATE
                - REJECTED_OUT_OF_ORDER
                - REJECTED_INVALID_TRANSITION
              detail:
                type: string
    PhotoUploadRequest:
      type: object
      properties:
        clientPhotoId: *id001
        stage:
          type: string
          enum:
          - LOADED
          - IN_TRANSIT
          - ARRIVED
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
        sizeBytes:
          type: integer
          maximum: 1572864
        capturedAt: *id003
      required:
      - clientPhotoId
      - stage
      - contentType
    ReturnConfirm:
      type: object
      properties:
        drugMasterId: *id001
        qtyLocal:
          type: number
          exclusiveMinimum: 0
        lotId: *id001
        version:
          type: integer
      required:
      - drugMasterId
      - qtyLocal
      description: 'In kind only: same drug and quantity as borrowed (F-30). No payment
        option exists.'
    MappingVerify:
      type: object
      properties:
        drugMasterId: *id001
        gpId:
          type: string
        unitConversionFactor:
          type: number
          exclusiveMinimum: 0
          default: 1
        localPackUnit:
          type: string
        baseUnitsPerPack:
          type: number
          exclusiveMinimum: 0
        manufacturer:
          type: string
        version:
          type: integer
      required:
      - version
      - baseUnitsPerPack
    ConfigUpdate:
      type: object
      properties:
        value: {}
        scope:
          type: string
        reason:
          type: string
      required:
      - value
    KillSwitch:
      type: object
      properties:
